name = "typeset"
description = "Lazy paragraph layout and glyph-atlas text drawing (macOS only)"
version = "0.1.0-dev"

authors = ["Matt Rawcliffe"]
licenses = "GPL-3.0-only"
website = ""
tags = []

[available.'case(os)']
macos = true
'...' = false

[[depends-on]]
coretext = "*"
sdl3 = "*"
texts = "*"

[[pins]]
coretext = { path = "../coretext" }
sdl3 = { path = "../sdl3" }
texts = { path = "../texts" }

[build-switches]
"*".ada_version = "Ada2022"
"*".compile_checks = "Errors"
"*".runtime_checks = "Everything"
"*".style_checks = "Yes"
"*".contracts = "Yes"

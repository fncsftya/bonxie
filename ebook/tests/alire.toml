name = "ebook_tests"
description = "Tests of the pages ebook draws"
version = "0.1.0-dev"

authors = ["Matt Rawcliffe"]
licenses = "GPL-3.0-only"
website = ""
tags = []

executables = ["ebook_test", "page_view"]

[[depends-on]]
ebook = "*"
pomarine_ui = "*"

[[pins]]
ebook = { path = ".." }
pomarine_ui = { path = "../../pomarine/ui" }
pomarine_vm = { path = "../../pomarine/vm" }
pomarine_model = { path = "../../pomarine/model" }
coretext = { path = "../../pomarine/coretext" }
sdl3 = { path = "../../pomarine/sdl3" }
texts = { path = "../../pomarine/texts" }
typeset = { path = "../../pomarine/typeset" }
yoga = { path = "../../pomarine/yoga" }

[build-switches]
"*".ada_version = "Ada2022"
"*".compile_checks = "Errors"
"*".runtime_checks = "Everything"
"*".style_checks = "Yes"
"*".contracts = "Yes"

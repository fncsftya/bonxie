name = "mlx"
description = "Local language models on MLX (Apple silicon), by mlx-swift-lm"
version = "0.1.0-dev"

authors = ["Matt Rawcliffe"]
licenses = "GPL-3.0-only"
website = ""
tags = []

[available.'case(os)']
macos = true
'...' = false

[[actions]]
type = "post-fetch"
command = ["sh", "native/build.sh"]

[build-switches]
"*".ada_version = "Ada2022"
"*".compile_checks = "Errors"
"*".runtime_checks = "Everything"
"*".style_checks = "Yes"
"*".contracts = "Yes"

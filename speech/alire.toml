name = "speech"
description = "Speech to text, with Apple's SpeechAnalyzer (macOS 26 or later)"
version = "0.1.0-dev"

authors = ["Matt Rawcliffe"]
licenses = "MIT"
website = ""
tags = []

[available.'case(os)']
macos = true
'...' = false

[[depends-on]]
transcribe = "*"

[[pins]]
transcribe = { path = "../transcribe" }

[build-switches]
"*".ada_version = "Ada2022"
"*".compile_checks = "Errors"
"*".runtime_checks = "Everything"
"*".style_checks = "Yes"
"*".contracts = "Yes"

name = "speech"
description = "Speech to text: SpeechAnalyzer or Parakeet on Core ML (macOS 26+)"
version = "0.1.0-dev"
licenses = "GPL-3.0-only"

authors = ["Matt Rawcliffe"]
website = ""
tags = []

[available.'case(os)']
macos = true
'...' = false

[[actions]]
type = "post-fetch"
command = ["sh", "native/build.sh"]

[build-switches]
"*".ada_version = "Ada2022"
"*".compile_checks = "Errors"
"*".runtime_checks = "Everything"
"*".style_checks = "Yes"
"*".contracts = "Yes"

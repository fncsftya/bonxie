name = "bonxie_tests"
description = "Golden-image tests of what bonxie draws"
version = "0.1.0-dev"
licenses = "GPL-3.0-only"

authors = ["Matt Rawcliffe"]
website = ""
tags = []

executables = ["golden"]

[available.'case(os)']
macos = true
'...' = false

[[depends-on]]
pomarine = "*"
bonxie = "*"
pomarine_goldens = "*"
pomarine_native = "*"
pomarine_testing = "*"

[[pins]]
pomarine = { path = "../pomarine" }
bonxie = { path = ".." }
pomarine_goldens = { path = "../pomarine/goldens" }
pomarine_native = { path = "../pomarine/native" }
pomarine_testing = { path = "../pomarine/testing" }
speech = { path = "../speech" }
vision = { path = "../vision" }
ebook = { path = "../ebook" }
webshot = { path = "../webshot" }

[build-switches]
"*".ada_version = "Ada2022"
"*".compile_checks = "Errors"
"*".runtime_checks = "Everything"
"*".style_checks = "Yes"
"*".contracts = "Yes"

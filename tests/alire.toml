name = "bonxie_tests"
description = "Golden-image tests of what bonxie draws"
version = "0.1.0-dev"

authors = ["Matt Rawcliffe"]
licenses = "LicenseRef-Proprietary"
website = ""
tags = []

executables = ["golden"]

[available.'case(os)']
macos = true
'...' = false

[[depends-on]]
bonxie = "*"
pomarine_goldens = "*"
pomarine_native = "*"
pomarine_ui = "*"
texts = "*"

[[pins]]
bonxie = { path = ".." }
pomarine_goldens = { path = "../pomarine/goldens" }
pomarine_native = { path = "../pomarine/native" }
pomarine_ui = { path = "../pomarine/ui" }
coretext = { path = "../pomarine/coretext" }
sdl3 = { path = "../pomarine/sdl3" }
speech = { path = "../speech" }
texts = { path = "../pomarine/texts" }
typeset = { path = "../pomarine/typeset" }
vision = { path = "../vision" }
ebook = { path = "../ebook" }
webshot = { path = "../webshot" }
yoga = { path = "../pomarine/yoga" }

[build-switches]
"*".ada_version = "Ada2022"
"*".compile_checks = "Errors"
"*".runtime_checks = "Everything"
"*".style_checks = "Yes"
"*".contracts = "Yes"

name = "bonxie_ui"
description = "UI components above the graphics layers and below the application"
version = "0.1.0-dev"

authors = ["Matt Rawcliffe"]
licenses = "GPL-3.0-only"
website = ""
tags = []

[available.'case(os)']
macos = true
'...' = false

[[depends-on]]
sdl3 = "*"
texts = "*"
typeset = "*"
vision = "*"
yoga = "*"

[[pins]]
coretext = { path = "../coretext" }
sdl3 = { path = "../sdl3" }
texts = { path = "../texts" }
typeset = { path = "../typeset" }
vision = { path = "../vision" }
yoga = { path = "../yoga" }

[build-switches]
"*".ada_version = "Ada2022"
"*".compile_checks = "Errors"
"*".runtime_checks = "Everything"
"*".style_checks = "Yes"
"*".contracts = "Yes"

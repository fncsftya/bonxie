name = "vision"
description = "Text in pictures, recognized with Apple's Vision (macOS only)"
version = "0.1.0-dev"
licenses = "GPL-3.0-only"

authors = ["Matt Rawcliffe"]
website = ""
tags = []

[available.'case(os)']
macos = true
'...' = false

[[depends-on]]
pomarine = "*"

[[pins]]
pomarine = { path = "../pomarine" }

[build-switches]
"*".ada_version = "Ada2022"
"*".compile_checks = "Errors"
"*".runtime_checks = "Everything"
"*".style_checks = "Yes"
"*".contracts = "Yes"

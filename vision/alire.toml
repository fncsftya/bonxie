name = "vision"
description = "Text in pictures, recognized with Apple's Vision (macOS only)"
version = "0.1.0-dev"

authors = ["Matt Rawcliffe"]
website = ""
tags = []

[available.'case(os)']
macos = true
'...' = false

[[depends-on]]
pomarine_ui = "*"

[[pins]]
pomarine_ui = { path = "../pomarine/ui" }
coretext = { path = "../pomarine/coretext" }
sdl3 = { path = "../pomarine/sdl3" }
texts = { path = "../pomarine/texts" }
typeset = { path = "../pomarine/typeset" }
yoga = { path = "../pomarine/yoga" }

[build-switches]
"*".ada_version = "Ada2022"
"*".compile_checks = "Errors"
"*".runtime_checks = "Everything"
"*".style_checks = "Yes"
"*".contracts = "Yes"

name = "bench"
description = "Benchmarks for laying out and drawing long documents"
version = "0.1.0-dev"

authors = ["Matt Rawcliffe"]
licenses = "MIT"
website = ""
tags = []

executables = ["bench", "text_area_bench", "widget_bench", "item_bench"]

[available.'case(os)']
macos = true
'...' = false

[[depends-on]]
bonxie = "*"
bonxie_ui = "*"
coretext = "*"
sdl3 = "*"
texts = "*"
typeset = "*"
yoga = "*"

[[pins]]
bonxie = { path = ".." }
bonxie_ui = { path = "../ui" }
coretext = { path = "../coretext" }
sdl3 = { path = "../sdl3" }
speech = { path = "../speech" }
texts = { path = "../texts" }
typeset = { path = "../typeset" }
vision = { path = "../vision" }
webshot = { path = "../webshot" }
yoga = { path = "../yoga" }

[build-switches]
"*".ada_version = "Ada2022"
"*".compile_checks = "Errors"
"*".runtime_checks = "Everything"
"*".style_checks = "Yes"
"*".contracts = "Yes"

name = "bench"
description = "Benchmarks for laying out and drawing long documents"
version = "0.1.0-dev"

authors = ["Matt Rawcliffe"]
licenses = "GPL-3.0-only"
website = ""
tags = []

executables = ["bench", "text_area_bench", "widget_bench", "item_bench"]

[available.'case(os)']
macos = true
'...' = false

[[depends-on]]
bonxie = "*"
pomarine_native = "*"
pomarine_ui = "*"
coretext = "*"
sdl3 = "*"
texts = "*"
typeset = "*"
yoga = "*"

[[pins]]
bonxie = { path = ".." }
pomarine_native = { path = "../pomarine/native" }
pomarine_ui = { path = "../pomarine/ui" }
coretext = { path = "../pomarine/coretext" }
sdl3 = { path = "../pomarine/sdl3" }
speech = { path = "../speech" }
texts = { path = "../pomarine/texts" }
typeset = { path = "../pomarine/typeset" }
vision = { path = "../vision" }
ebook = { path = "../ebook" }
webshot = { path = "../webshot" }
yoga = { path = "../pomarine/yoga" }

[build-switches]
"*".ada_version = "Ada2022"
"*".compile_checks = "Errors"
"*".runtime_checks = "Everything"
"*".style_checks = "Yes"
"*".contracts = "Yes"

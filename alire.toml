name = "bonxie"
description = "Writing application with transcription and sources"
version = "0.1.0-dev"

authors = ["Matt Rawcliffe"]
licenses = "GPL-3.0-only"
website = ""
tags = []

executables = ["bonxie"]

[[depends-on]]
pomarine_native = "*"
pomarine_ui = "*"
coretext = "*"
ebook = "*"
mlx = "*"
sdl3 = "*"
speech = "*"
texts = "*"
typeset = "*"
vision = "*"
webshot = "*"
yoga = "*"
json = "*"

[[pins]]
pomarine_native = { path = "pomarine/native" }
pomarine_ui = { path = "pomarine/ui" }
coretext = { path = "pomarine/coretext" }
ebook = { path = "ebook" }
mlx = { path = "mlx" }
sdl3 = { path = "pomarine/sdl3" }
speech = { path = "speech" }
texts = { path = "pomarine/texts" }
typeset = { path = "pomarine/typeset" }
vision = { path = "vision" }
webshot = { path = "webshot" }
yoga = { path = "pomarine/yoga" }
json = { path = "vendor/json-ada/json" }

[build-switches]
"*".ada_version = "Ada2022"
"*".compile_checks = "Errors"
"*".runtime_checks = "Everything"
"*".style_checks = "Yes"
"*".contracts = "Yes"

[[depends-on]]
ada_sqlite3 = "~0.1.1"

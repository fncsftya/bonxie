name = "bonxie"
description = "Podcast creation application."
version = "0.1.0-dev"

authors = ["Matt Rawcliffe"]
licenses = "MIT"
website = ""
tags = []

executables = ["bonxie"]

[[depends-on]]
bonxie_ui = "*"
coretext = "*"
sdl3 = "*"
typeset = "*"
yoga = "*"

[[pins]]
bonxie_ui = { path = "ui" }
coretext = { path = "coretext" }
sdl3 = { path = "sdl3" }
typeset = { path = "typeset" }
yoga = { path = "yoga" }

[build-switches]
"*".ada_version = "Ada2022"
"*".compile_checks = "Errors"
"*".runtime_checks = "Everything"
"*".style_checks = "Yes"
"*".contracts = "Yes"

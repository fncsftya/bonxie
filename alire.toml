name = "bonxie"
description = "Writing application with transcription and sources"
version = "0.1.0-alpha"
licenses = "GPL-3.0-only"

authors = ["Matt Rawcliffe"]
website = ""
tags = []

executables = ["bonxie"]

[[depends-on]]
pomarine = "*"
pomarine_native = "*"
ebook = "*"
harper = "*"
speech = "*"
vision = "*"
webshot = "*"
json = "*"

[[pins]]
pomarine = { path = "pomarine" }
pomarine_native = { path = "pomarine/native" }
pomarine_testing = { path = "pomarine/testing" }
ebook = { path = "ebook" }
harper = { path = "harper" }
speech = { path = "speech" }
vision = { path = "vision" }
webshot = { path = "webshot" }
json = { path = "vendor/json-ada/json" }

[build-switches]
"*".ada_version = "Ada2022"
"*".compile_checks = "Errors"
"*".runtime_checks = "Everything"
"*".style_checks = "Yes"
"*".contracts = "Yes"

[[depends-on]]
ada_sqlite3 = "~0.1.1"

[[depends-on]]
gnatprove = "^16.1.0"

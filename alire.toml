name = "bonxie"
description = "Podcast creation application."
version = "0.1.0-dev"

authors = ["Matt Rawcliffe"]
licenses = "GPL-3.0-only"
website = ""
tags = []

executables = ["bonxie"]

[[depends-on]]
bonxie_ui = "*"
coretext = "*"
sdl3 = "*"
speech = "*"
texts = "*"
typeset = "*"
vision = "*"
webshot = "*"
yoga = "*"

[[pins]]
bonxie_ui = { path = "ui" }
coretext = { path = "coretext" }
sdl3 = { path = "sdl3" }
speech = { path = "speech" }
texts = { path = "texts" }
transcribe = { path = "transcribe" }
typeset = { path = "typeset" }
vision = { path = "vision" }
webshot = { path = "webshot" }
yoga = { path = "yoga" }

[build-switches]
"*".ada_version = "Ada2022"
"*".compile_checks = "Errors"
"*".runtime_checks = "Everything"
"*".style_checks = "Yes"
"*".contracts = "Yes"

[[depends-on]]
ada_sqlite3 = "~0.1.1"

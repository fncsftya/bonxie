name = "coretext"
description = "Ada bindings for CoreText text shaping and rasterization (macOS only)"
version = "0.1.0-dev"

authors = ["Matt Rawcliffe"]
licenses = "GPL-3.0-only"
website = ""
tags = []

[available.'case(os)']
macos = true
'...' = false

[build-switches]
"*".ada_version = "Ada2022"
"*".compile_checks = "Errors"
"*".runtime_checks = "Everything"
"*".style_checks = "Yes"
"*".contracts = "Yes"
